# ---------------------------------------------------------------------------
# electron-builder 配置（Windows / x64）
# ---------------------------------------------------------------------------
#
# ⚠️ **可复现的口径**：本配置保证的是「**同样的输入 → 同样能构建、同样能安装、
#    同样能运行**」，**不承诺字节级一致**——NSIS 安装器会内嵌构建时间戳，
#    两次构建的 exe 哈希必然不同。要追字节一致需额外固定 `SOURCE_DATE_EPOCH`
#    与工具链版本，超出本项目当前目标。
#
# 版本锁定：见 `scripts/pack.cjs`（锁 electron 版本 + 复用本地二进制，离线可打包）。

appId: com.fnmusic.desktop
productName: Sanlos Music
# ⚠️ **版权信息与「设置 → 关于」里的软件信息同源**（`shared/appInfo.ts`）。
copyright: Copyright © 2026 广西闪链时空网络科技有限公司

# ⚠️ **锁死 electron 版本**：不写这一行，builder 会自己解析版本，
#    可能拉到与项目里那份不同的 electron（→ 产物行为随时间漂移）。
electronVersion: 32.3.3

directories:
  output: release
  buildResources: build

# ⚠️ **运行时依赖为空**：本应用是纯静态渲染层 + Node 主进程，
#    产物里不含任何 npm 运行时依赖（react / react-dom / zustand 只在**构建期**
#    被 Vite 打进 dist/assets/*.js）→ 所以它们在 package.json 里属于
#    devDependencies，**不会**被塞进 app.asar。
#    依赖为空也让 electron-builder 不必做依赖收集 / npmRebuild → 更可复现。
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  # 锁死口径：包体里**不带**源码映射（当前构建也不产出 .map，这里只是兜底）。
  - '!dist/**/*.map'
  - '!dist-electron/**/*.map'

# 打包进 asar（单个文件，减少解压次数，也避免散落一堆小文件）。
asar: true

# 去掉安装期的 npm 脚本（`postinstall` 是给开发用的兜底安装脚本，
# 装到用户机器上不需要跑）。
removePackageScripts: true

win:
  # ⚠️ T75：应用图标 —— exe / 安装包 / 快捷方式 / 任务栏都用它
  #    （之前没有这一行 ⇒ 用的是 Electron 默认图标）。
  # ⚠️ 用 PNG（不手工拼 ICO）—— electron-builder 自己转成 exe 需要的尺寸。
  icon: build/icon.png
  # ⚠️ **T87：显式钉住时间戳源**（不依赖默认值 —— 默认值会变、会挂）。
  #    ⚠️ **为什么必须有时间戳**：没有 RFC 3161 时间戳 ⇒ 证书到期那天，
  #       **历史上所有安装包一起失效**（用户装不上了）⇒ 打包后要**断言**它。
  #    （SignPath 路线由 SignPath 负责打时间戳；这里管的是「本机 / 自签」路线。）
  #
  # ⚠️⚠️ **必须写在 `win.signtoolOptions` 下面**（**不能**写在 `win` 顶层）：
  #    - `win.timeStampServer` / `win.sign.timeStampServer` **都不是合法键**
  #      ⇒ electron-builder 的配置校验会**直接失败** ⇒ **整个打包挂掉**
  #      （2026-11-10 实测：CI run 42857375893 就死在这一行）。
  #    - 合法位置只有 `win.signtoolOptions.timeStampServer`（传统时间戳 `/t`）
  #      与 `win.signtoolOptions.rfc3161TimeStampServer`（RFC 3161 时间戳 `/tr`，
  #      sha256 签名走这条）—— 代码读的就是这两个
  #      （`app-builder-lib/out/codeSign/windowsSignToolManager.js`）。
  #    - 两者缺省都是 `http://timestamp.digicert.com`；显式写出来是为了
  #      「不依赖默认值」。
  #    - ⚠️ 这一段只影响**真去签名时**的命令行参数；没有证书时**不会**触发签名。
  signtoolOptions:
    timeStampServer: http://timestamp.digicert.com
    rfc3161TimeStampServer: http://timestamp.digicert.com
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: FN-Music-Setup-${version}.${ext}

portable:
  artifactName: FN-Music-Portable-${version}.${ext}

# ---------------------------------------------------------------------------
# 自动更新（Task 23）
# ---------------------------------------------------------------------------
# ⚠️ **`generic` provider 是「只读」的**：它只声明「更新清单与安装包放在这个地址」，
#    electron-builder **不会**往那儿上传任何东西（上传是发布脚本 + 你自己的服务器的事）。
#
# ⚠️ **客户端真正读的地址不是这里**：应用「设置 → 自动更新 → 更新服务器地址」
#    才是客户端的单一真相源（存 `prefs.json` 的 `update.baseUrl`）——
#    换服务器时**不该重新打包**。
#    下面这个占位符只是让 electron-builder 自己的工具有个默认值；
#    换成你自己的地址即可（形如 `https://updates.example.com/fnmusic`）。
#
# ⚠️ 清单是**本项目自定义的 JSON**（`latest.json`），不是 electron-builder 的
#    `latest.yml` —— 理由见 `scripts/publish-manifest.mjs` 的注释（零新依赖）。
publish:
  - provider: generic
    url: https://updates.example.com/fnmusic

# ⚠️ **代码签名**：本项目**默认不签**（`win.sign` 留空）⇒
#    产物未签名 → Windows SmartScreen 会提示「未知发布者」。
#
# ⚠️ **要签不用改这个文件**：electron-builder 原生读这两个环境变量 ——
#      $env:WIN_CSC_LINK='<证书路径（.pfx）或 base64 内容>'
#      $env:WIN_CSC_KEY_PASSWORD='<证书口令>'
#    没设就**自动跳过签名**（不报错）⇒ 证书到手时**不必改任何代码**。
#
# ⚠️ **打包后有断言**（T86，`scripts/pack.cjs` → `tools/fn-check-signature.mjs`）：
#    配了证书却没签上 ⇒ **打包直接失败**（electron-builder 本身可能只警告）。
#    没配证书 ⇒ 打印一行「产物未签名（预期行为）」，**不**失败。
#
# ⚠️ 证书怎么准备（本地自签测试 / 真实 OV 证书）见 `docs/packaging.md` 第七节。

