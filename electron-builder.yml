appId: com.fnmusic.desktop
productName: 飞牛音乐
copyright: Copyright © 2026 fnmusic-desktop

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: FN-Music-Setup-${version}.${ext}

portable:
  artifactName: FN-Music-Portable-${version}.${ext}
