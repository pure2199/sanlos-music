# ---------------------------------------------------------------------------
# T87：发版工作流（CI 打包 → SignPath 送签 → 人工审批 → 校验 → 发 Release）
# ---------------------------------------------------------------------------
#
# ⚠️ **为什么必须搬进 CI**：SignPath 免费计划（Foundation）以「**可信构建**」为前提
#    —— 只签 **CI 从本仓库构建出的**产物 ⇒ 本机手工打包的包**签不了**。
#    ⇒ 发版流程从「本机手工」改为「CI 自动」。
#
# ⚠️ **失败即失败（安全失败设计）**：下列任一情况 ⇒ 工作流**失败**，
#    **绝不产出「声称已签名」的产物**：
#    - SignPath 的 secrets / variables 没配 ⇒ **快速失败**并说明缺哪几个；
#    - 签名状态不是 `Valid` ⇒ 失败；
#    - **没有 RFC 3161 时间戳** ⇒ 失败（证书到期后历史包会集体失效）；
#    - 签名者 CN 与预期不符 ⇒ 失败；
#    - 审批超时 ⇒ 失败（artifact 保留着供排查）。
#
# ⚠️ **每个版本都要人工批一次**：Foundation 计划要求**逐次人工审批**
#    （在 SignPath 平台上点一次）⇒ 工作流会**一直等**（`wait-for-completion`）。

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v0.2.5）'
        required: true
        type: string
      pack_only:
        description: '只打包（验证 CI 能出包）；关掉才会送签 + 发版'
        required: false
        default: true
        type: boolean
      sign:
        # ⚠️ **默认 true** —— 签名是默认路径；未签名必须**显式**关掉（fail-closed 方向）。
        #    关掉后走「未签名发布」：断言产物**确实没有签名** → 生成清单 → 发 Release。
        # ⚠️ **T87.17：SignPath Foundation 的申请已被拒**（可见度不足）⇒ 签名路径
        #    目前**必然失败**在「Check SignPath configuration」（缺 5 个 secret/variable）。
        #    ⇒ **当前发版请手动取消勾选本项**，走未签名路径；
        #    未签名路径同样有**替代信任锚**（GitHub attestation，见下面的 Attest 步骤）。
        description: '发布时是否走 SignPath 签名（SignPath 申请已被拒 ⇒ 当前请取消勾选；未签名路径会断言产物确实没签名，并生成构建来源证明）'
        required: false
        default: true
        type: boolean

# ⚠️ **同一个标签只允许一个发版跑**（两个人同时点 ⇒ 互相覆盖资产）。
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  # ⚠️ 发 Release 需要写权限（上传资产 / 建 Release）。
  contents: write
  # ⚠️ **T87.17：attestation（构建来源证明）需要这两项**：
  #    `id-token: write`     ⇒ 换 Sigstore 短期签名证书用的 OIDC token；
  #    `attestations: write` ⇒ 把 attestation 落进 GitHub 的 attestation 库。
  #    ⇒ 这是**没有公开可信代码签名证书**时的「发布者身份」替代信任锚：
  #       签发方是 GitHub（Sigstore），绑定**最终产物的 digest**。
  id-token: write
  attestations: write

jobs:
  release:
    name: build → sign → verify → publish
    runs-on: windows-latest
    # ⚠️ **人工审批可能很久**（SignPath 平台上要手动点一次）⇒ 超时给足。
    timeout-minutes: 120

    env:
      # ⚠️ 与 `ci.yml` 保持一致（**T87.9 更正：镜像变量的写法**）：
      #    `ELECTRON_MIRROR` 的值**必须自带结尾的 `/`** —— `@electron/get` 是**纯字符串拼接**
      #    （`${mirror}${version}/${file}`）⇒ 少了 `/` 会拼出 `…/downloadv32.3.3/…` ⇒ 404
      #    ⇒ **整个打包挂掉**（2026-11-10 实测：Release run 42861484377）。
      #    另：`ELECTRON_BUILDER_BINARIES_MIRROR` 由 electron-builder 自己读，
      #    它**自己补尾斜杠** ⇒ 带不带 `/` 都对。
      #    详细推导见 `ci.yml` 里同一段注释与 spec 第十节。
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download
      # ⚠️ 产物目录（`scripts/pack.cjs` 与 `scripts/publish-manifest.mjs` 共用这个变量）。
      FNM_PACK_OUTPUT: release-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ⚠️ **只签这个标签的源码** —— 可信构建的前提就是「产物来自这个仓库的这个提交」。
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # ⚠️ 不用 Node 26：electron@32 的 install.js 依赖的 extract-zip@2 在 Node 26 上
          #    解压会挂起（详见 scripts/ensure-electron.cjs 的注释）。
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        # ⚠️ **直接调 pack.cjs**（不跑 `npm run pack`）—— 后者会**再 build 一次**。
        #    pack.cjs 自带前置检查（缺 `dist/` 会早失败并说清楚缺什么）。
        # ⚠️ 这一步产出的 exe **必然没签名**（SignPath 是**打包之后**才签的）
        #    ⇒ 签名断言放在「取回签名件之后」。
        run: node scripts/pack.cjs

      - name: Upload unsigned artifacts
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-artifacts
          # ⚠️ 这个 artifact 会被**交给 SignPath**（按 artifact-id 拉取）⇒
          #    里面的 exe 就是待签的那两个。
          path: release-ci/*
          retention-days: 30
          if-no-files-found: error

      - name: Summary (pack only)
        if: ${{ inputs.pack_only }}
        # ⚠️ **T87.10：脚本正文里一律不许有反引号**（也不许有双引号字符串）：
        #    PowerShell 的反引号是**转义符** ⇒ 双引号里的 Markdown 行内代码
        #    被当成「转义序列起始」⇒ 报 `The Unicode escape sequence is not valid`
        #    ⇒ **整个脚本 ParserError** ⇒ 步骤退出码 1
        #    （2026-11-10 实测：Release run 42865707790 死在这一步）。
        #    ⇒ 字符串一律用**单引号**，Markdown 的行内代码改用「」。
        run: |
          echo '### 只打包模式' >> $env:GITHUB_STEP_SUMMARY
          echo '' >> $env:GITHUB_STEP_SUMMARY
          echo '产物已上传为 artifact「unsigned-artifacts」（**未签名**，符合预期）。' >> $env:GITHUB_STEP_SUMMARY
          echo '要真正发版，把「pack_only」关掉再跑一次。' >> $env:GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      # 下面这些步骤只在「真发版」时跑
      # -----------------------------------------------------------------------

      - name: Check SignPath configuration
        if: ${{ !inputs.pack_only && inputs.sign }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID || secrets.SIGNPATH_ORG_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG || secrets.SIGNPATH_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_SLUG: ${{ vars.SIGNPATH_ARTIFACT_SLUG || secrets.SIGNPATH_ARTIFACT_SLUG }}
        run: node scripts/check-signpath-config.mjs

      - name: SignPath — submit signing request and fetch signed artifact
        if: ${{ !inputs.pack_only && inputs.sign }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID || secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || secrets.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG || secrets.SIGNPATH_ARTIFACT_SLUG }}
          # ⚠️ 待签产物 = 上面那个 artifact（SignPath 按 id 去 GitHub 上拉）。
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          # ⚠️ **人工审批**：SignPath 那边不点「批准」，这里就一直等（最多 90 分钟）。
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '5400'
          output-artifact-directory: signed

      - name: Verify signed artifact
        if: ${{ !inputs.pack_only && inputs.sign }}
        # ⚠️ **发布闸门**：状态必须是 Valid、必须带 RFC 3161 时间戳、CN 必须相等。
        #    ⚠️ CN 口径与**客户端**同一份（`shared/update.ts`）⇒ 客户端认的，
        #       这里也认；客户端不认的，这里也不认。
        run: >
          node tools/fn-check-signature.mjs
          --expect valid
          --require-timestamp
          --expect-cn "${{ vars.SIGNPATH_EXPECTED_CN || 'SignPath Foundation' }}"
          signed

      - name: Replace artifacts with signed ones
        if: ${{ !inputs.pack_only && inputs.sign }}
        run: |
          $ErrorActionPreference = 'Stop'
          # ⚠️ **签名件的文件清单必须与未签名件一致**（SignPath 只该换掉 exe 的字节）。
          $unsigned = Get-ChildItem -Path release-ci -File | ForEach-Object { $_.Name } | Sort-Object
          $signed = Get-ChildItem -Path signed -File | ForEach-Object { $_.Name } | Sort-Object
          if (Compare-Object $unsigned $signed) {
            throw "签名件与原产物的文件清单不一致：原 = $($unsigned -join ', ')，签名后 = $($signed -join ', ')"
          }
          Copy-Item -Path signed/*.exe -Destination release-ci/ -Force

      - name: Write update manifest (signed)
        if: ${{ !inputs.pack_only && inputs.sign }}
        # ⚠️ 清单必须基于**签名后**的安装包算 SHA-512（客户端会拿它核对下载到的文件）。
        #    ⇒ 这一步**必须排在**「Replace artifacts with signed ones」**之后**。
        env:
          UPDATE_NOTES: '安装包已由 SignPath Foundation 签名（Authenticode，含 RFC 3161 时间戳）。'
        run: node scripts/publish-manifest.mjs

      - name: Verify unsigned artifacts
        if: ${{ !inputs.pack_only && !inputs.sign }}
        # ⚠️ **未签名发布的闸门**：「这一版没有签名」必须是**构建期事实**，不是口头承诺。
        #    产物若因为任何原因带上了签名（本地装了证书 / 环境里有 WIN_CSC_LINK……）
        #    ⇒ **工作流失败，绝不发布**。
        #    （`--expect none` 是既有选项，语义 = 每个产物都必须**没有**签名，一字未改。）
        run: node tools/fn-check-signature.mjs --expect none release-ci

      - name: Write update manifest (unsigned)
        if: ${{ !inputs.pack_only && !inputs.sign }}
        # ⚠️ notes 里**不许**出现「已签名 / SignPath」这类措辞 —— 这一版确实没签。
        env:
          UPDATE_NOTES: '本版未做代码签名（Windows 可能提示「未知发布者」）；详见 Release 说明。'
        run: node scripts/publish-manifest.mjs

      # -----------------------------------------------------------------------
      # T89-㉔：产物改名归一（把「构建出来的名字」收敛成「对外发布的名字」）
      # -----------------------------------------------------------------------
      #
      # ⚠️ **为什么需要这一步**：
      #   - 规范名 = **productName 去掉空白** + "-Setup-<版本>.exe"
      #     （= "SanlosMusic-Setup-…"，见 `electron-builder.yml`；
      #     单一真相源 = package.json 的 productName）；
      #   - 但 **`workflow_dispatch` 用的是「你选的分支」上的工作流 YAML**，
      #     而 `actions/checkout` 签出的是**标签的源码**
      #     ⇒ 标签里的 `electron-builder.yml` 还是旧名（`FN-Music-*`）
      #     ⇒ 这一步把产物改名成规范名；
      #   - ⚠️ **必须排在「写清单」之后**：标签里的 `publish-manifest.mjs` 认的是旧名
      #     （它跑在标签的源码上）⇒ 它跑完产出 latest.json 之后才能改名；
      #   - ⚠️ **必须排在「签发 attestation」之前**：attestation 的 subject **带文件名**
      #     ⇒ 改名之后签发，subject 才是对外的名字（否则按新名验证必然失败）。
      #   ⇒ 对**未来的标签**是 no-op（那时构建出来就已经是规范名）。
      #
      # ⚠️ **为什么规范名里没有空格**（2026-11-13 实测，Release run #13）：
      #   - GitHub 会把 Release 资产名里的**空格换成点**
      #     ⇒ 上传 "Sanlos Music-Setup-0.2.9.exe" 实际存成 "Sanlos.Music-Setup-0.2.9.exe"；
      #   - **带空格的下载 URL 直接 404**（点形才 206）
      #     ⇒ 自动更新清单里的 `url` 指向空格名就会下载失败；
      #   - attestation 的 subject 带文件名 ⇒ 空格名与可下载的点名对不上。
      #   ⇒ 规范名一律**去空白**。
      - name: Normalize asset names
        id: names
        if: ${{ !inputs.pack_only }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $product = $pkg.productName
          if (-not $product) { throw 'package.json 里没有 productName' }
          # ⚠️ **发布名去空白**（GitHub 不许空格，见上面的实测记录）。
          $prefix = ($product -replace '\s+', '')
          if (-not $prefix) { throw 'productName 去掉空白后是空的' }
          $setup = "$prefix-Setup-$version.exe"
          $portable = "$prefix-Portable-$version.exe"
          # ⚠️ 要收敛的旧名：
          #   ① 历史标签的 `FN-Music-*`；
          #   ② 带空格的产品名（GitHub 存资产名时会把空格换成点 ⇒ 本地也可能是点形）；
          #   ③ 宏没展开的怪名。
          $spaced = $product
          $dotted = $product -replace ' ', '.'
          $pairs = @(
            @("FN-Music-Setup-$version.exe", $setup),
            @("FN-Music-Portable-$version.exe", $portable),
            @("$spaced-Setup-$version.exe", $setup),
            @("$spaced-Portable-$version.exe", $portable),
            @("$dotted-Setup-$version.exe", $setup),
            @("$dotted-Portable-$version.exe", $portable),
            @('${productName}-Setup-' + $version + '.exe', $setup),
            @('${productName}-Portable-' + $version + '.exe', $portable)
          )
          foreach ($pair in $pairs) {
            $target = Join-Path 'release-ci' $pair[1]
            if (Test-Path -LiteralPath $target) { continue }
            $source = Join-Path 'release-ci' $pair[0]
            if (-not (Test-Path -LiteralPath $source)) { continue }
            Rename-Item -LiteralPath $source -NewName $pair[1]
            Write-Output "已改名：$($pair[0]) -> $($pair[1])"
          }
          # ⚠️ **必须两个都在**（缺一个就是打包出问题 ⇒ 立刻失败，别发出去）。
          foreach ($name in @($setup, $portable)) {
            if (-not (Test-Path -LiteralPath (Join-Path 'release-ci' $name))) {
              throw "缺少产物：release-ci/$name"
            }
          }
          # ⚠️ 清单里的 name / url 同步改名（**sha512 与 size 不变** —— 字节没变，只是文件名）。
          $manifest = Join-Path 'release-ci' 'latest.json'
          if (Test-Path -LiteralPath $manifest) {
            $text = Get-Content -LiteralPath $manifest -Raw -Encoding UTF8
            foreach ($pair in $pairs) { $text = $text.Replace($pair[0], $pair[1]) }
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($manifest, $text, $utf8NoBom)
          }
          "setup=$setup" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT
          Write-Output "规范名：$setup / $portable"

      # -----------------------------------------------------------------------
      # T87.17：attestation —— 没有公开可信证书时的「发布者身份」信任锚
      # -----------------------------------------------------------------------
      #
      # ⚠️ **为什么加这一步**：SignPath Foundation 的申请已被拒（可见度不足）⇒
      #    公开产物**长期没有** Authenticode 签名 ⇒ 只给 sha256 不够
      #    （sha256 与 exe 在**同一个 Release 页面** ⇒ 改得了页面就改得了两者）。
      #    ⇒ 用 GitHub 官方的 **artifact attestation**（SLSA build provenance，
      #       由 Sigstore 公共实例签发）补上这一层：它证明「这个文件确实是
      #       **本仓库的 CI** 从**这个 tag** 构建出来的」，且换一字节就验不过。
      #
      # ⚠️ **顺序（错一步就等于签了个没用的东西）**：必须排在**产物定版之后** ——
      #    - 签名路径：排在「Replace artifacts with signed ones」之后（签名改了字节）；
      #    - 未签名路径：排在「Verify unsigned artifacts」之后；
      #    - 且必须排在「Write update manifest (...)」**之后**（latest.json 得先存在）。
      #
      # ⚠️ **两条路径都签发**（`if: !pack_only`）⇒ 将来真拿到证书了，
      #    这层信任锚照样在（不冲突、不重复）。

      - name: Attest build provenance
        if: ${{ !inputs.pack_only }}
        id: attest
        uses: actions/attest@v4
        with:
          # ⚠️ 用**官方 Action** 且**钉版本**（不许用会漂的 @main）。
          #    `actions/attest-build-provenance` v4 起已只是它的包装器 ⇒ 直接用前者。
          # ⚠️ subject 覆盖**两个 exe + 更新清单**（清单也是公开资产，也该可验证）。
          subject-path: '${{ github.workspace }}/release-ci/*.exe, ${{ github.workspace }}/release-ci/latest.json'

      - name: Summary (attestation)
        if: ${{ !inputs.pack_only }}
        # ⚠️ **脚本正文里一律不许有反引号**（PowerShell 的反引号是转义符）。
        env:
          ATTEST_URL: ${{ steps.attest.outputs['attestation-url'] }}
          SETUP_NAME: ${{ steps.names.outputs.setup }}
        #    一律用**单引号**，Markdown 的行内代码改用「」。
        run: |
          $ErrorActionPreference = 'Stop'
          echo '### 构建来源证明（attestation）' >> $env:GITHUB_STEP_SUMMARY
          echo '' >> $env:GITHUB_STEP_SUMMARY
          echo '本次发布的每个产物都附了 SLSA build provenance（由 GitHub / Sigstore 签发）。' >> $env:GITHUB_STEP_SUMMARY
          echo '' >> $env:GITHUB_STEP_SUMMARY
          echo 'attestation 页面：' >> $env:GITHUB_STEP_SUMMARY
          echo '${{ steps.attest.outputs['attestation-url'] }}' >> $env:GITHUB_STEP_SUMMARY
          echo '' >> $env:GITHUB_STEP_SUMMARY
          echo '本地验证（需要 GitHub CLI）：' >> $env:GITHUB_STEP_SUMMARY
          # ⚠️ **文件名带空格 ⇒ 必须加引号**（T89-㉔）。
          echo ('gh attestation verify "' + $env:SETUP_NAME + '" --repo pure2199/sanlos-music') >> $env:GITHUB_STEP_SUMMARY

      - name: Prepare release notes with checksums
        if: ${{ !inputs.pack_only }}
        env:
          TAG: ${{ inputs.tag }}
          # ⚠️ **T87.17**：说明里要区分「签过名 / 没签名」两种形态
          #    ⇒ 不能写死一句话（写死就成了假陈述）。
          SIGNED: ${{ inputs.sign }}
          ATTEST_URL: ${{ steps.attest.outputs['attestation-url'] }}
          # ⚠️ **T89-㉔**：资产名由「改名归一」那一步算出来（单一真相源 = productName）。
          SETUP_NAME: ${{ steps.names.outputs.setup }}
          PORTABLE_NAME: ${{ steps.names.outputs.portable }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notesFile = "docs/releases/$env:TAG.md"
          if (-not (Test-Path $notesFile)) { throw "找不到发布说明：$notesFile" }
          # ⚠️ **必须显式指定编码**：PowerShell 5.1 的默认编码是**控制台代码页**
          #    （简体中文机器 = 936 / GBK）⇒ 不指定就会把 UTF-8 的中文读成乱码。
          $base = Get-Content -Path $notesFile -Raw -Encoding UTF8
          $rows = @()
          foreach ($name in @($env:SETUP_NAME, $env:PORTABLE_NAME)) {
            $p = Join-Path 'release-ci' $name
            if (-not (Test-Path $p)) { throw "缺少资产：$p" }
            $hash = (Get-FileHash -Path $p -Algorithm SHA256).Hash.ToLower()
            $len = (Get-Item $p).Length
            $rows += "| $name | $len | $hash |"
          }
          # ⚠️ **行尾统一成 LF**（`docs/releases/*.md` 是 LF；`[Environment]::NewLine`
          #    在 Windows 上是 CRLF ⇒ 拼出来的说明会**混行尾**）。
          #    ⚠️ 用 `[char]10` 而不是反引号转义（工作流 run: 块里反引号是转义符）。
          $nl = [string][char]10
          # ⚠️ **T87.17**：这一段必须**按实际形态**写（签过名 / 没签名）——
          #    写死一句话就变成了假陈述。
          # ⚠️ **不要**用反引号（PowerShell 的反引号是转义符）；行内代码改用「」。
          $verify = @()
          if ($env:SIGNED -eq 'true') {
            $verify = @(
              '', '## 怎么确认这个安装包是官方的', '',
              '本版**已**做 Authenticode 代码签名（Windows 会显示发布者，不再是「未知发布者」）。', '',
              '此外，每个产物都附了**构建来源证明**（SLSA build provenance，由 GitHub / Sigstore 签发），可用 GitHub CLI 验证：', '',
              ('    gh attestation verify "' + $env:SETUP_NAME + '" --repo pure2199/sanlos-music'), '',
              ('attestation 页面：' + $env:ATTEST_URL)
            )
          } else {
            $verify = @(
              '', '## 怎么确认这个安装包是官方的', '',
              '⚠️ **本版没有代码签名**（Windows 会提示「未知发布者」）。', '',
              '替代方案是**构建来源证明**（SLSA build provenance，由 GitHub / Sigstore 签发）：它证明这个文件确实是**本仓库的 CI** 从对应标签构建出来的，换一字节就验不过。装好 GitHub CLI 后：', '',
              ('    gh attestation verify "' + $env:SETUP_NAME + '" --repo pure2199/sanlos-music'), '',
              ('attestation 页面：' + $env:ATTEST_URL), '',
              '不想装 GitHub CLI 的话，用本页末尾的 **sha256** 表逐字比对即可。'
            )
          }
          $extra = (@('', '---', '', '## 下载校验（sha256）', '', '| 文件 | 字节数 | sha256 |', '|---|---|---|', ($rows -join $nl), '', '⚠️ 产物由 CI 构建，NSIS 安装器内嵌构建时间戳 ⇒ 两次构建的字节不同 ⇒ 校验值只对**本 Release**的资产有效。') + $verify) -join $nl
          $outFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          # ⚠️ 写 UTF-8 **无 BOM**（PS 5.1 的 -Encoding utf8 会带 BOM ⇒ 页面开头多一个字符）。
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($outFile, ($base.TrimEnd() + $nl + $extra), $utf8NoBom)
          Write-Output "已生成带校验值的发布说明：$outFile"

      - name: Publish GitHub Release
        if: ${{ !inputs.pack_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          # ⚠️ **T89-㉔**：资产名由「改名归一」那一步算出来（单一真相源 = productName）。
          SETUP_NAME: ${{ steps.names.outputs.setup }}
          PORTABLE_NAME: ${{ steps.names.outputs.portable }}
        run: |
          $ErrorActionPreference = 'Stop'
          # ⚠️ 说明文件来自上一步（**带 sha256 与字节数**的副本）。
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          if (-not (Test-Path $notesFile)) { throw "找不到带校验值的发布说明：$notesFile" }
          $assets = @(
            "release-ci/$env:SETUP_NAME",
            "release-ci/$env:PORTABLE_NAME",
            "release-ci/latest.json"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "缺少资产：$asset" }
          }
          # ⚠️ **只发这 3 个资产**：
          #    `latest.yml` / `*.blockmap` 是 electron-builder 基于**未签名**的 exe 算的
          #    ⇒ 签名改了字节 ⇒ 它们**已经失效** ⇒ 发出去就是**错的数据**。
          #    （本项目的自动更新走自己的 `latest.json` + SHA-512，本来就不用它们。）
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
            gh release edit $env:TAG --notes-file $notesFile
          } else {
            gh release create $env:TAG @assets --title "Sanlos Music $env:TAG" --notes-file $notesFile
          }
