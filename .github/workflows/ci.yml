name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需要读仓库内容。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 应用是 Windows 专属（托盘 / DPAPI / safeStorage / `fnm://` 自定义协议）。
    # ⚠️ **T87.8：加上了「打包」** —— 配置级的错误只有真打包才会暴露。
    name: typecheck + unit tests + build + pack
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # ⚠️ **T87.9：这两个镜像变量的「拼接规则」不一样，别混着写**
      #    （实测根因见 `docs/superpowers/specs/2026-11-10-sanlos-music-signpath-code-signing-design.md` 第十节）：
      #
      # - `ELECTRON_MIRROR` 由 **@electron/get** 读，它的下载 URL 是**纯字符串拼接**
      #   （`${mirror}${version}/${file}`，见 `@electron/get/dist/cjs/artifact-utils.js`）
      #   ⇒ **值必须自带结尾的 `/`**，否则会拼出
      #   `…/releases/downloadv32.3.3/electron-v32.3.3-win32-x64.zip` ⇒ **HTTP 404**
      #   ⇒ **整个打包挂掉**（2026-11-10 实测：CI run 42861355862 / Release run 42861484377）。
      # - `ELECTRON_BUILDER_BINARIES_MIRROR` 由 **electron-builder 自己**读
      #   （`app-builder-lib/out/util/electronGet.js` 的 `getBinariesMirrorUrl`），
      #   它**自己会补尾斜杠** ⇒ 这里带不带 `/` 都对。
      #
      # ⚠️ **优先级**：`@electron/get` 的 `mirrorVar` 先看 `.npmrc` 注入的
      #   `npm_config_electron_mirror` ⇒ **在 `npm ci` 里走 npmmirror**（`.npmrc` 的值）；
      #   而 `node scripts/pack.cjs` **不是 npm 命令** ⇒ 拿不到那些变量
      #   ⇒ **打包这一步只有 `ELECTRON_MIRROR` 生效** ⇒ 值写错 = CI 打包直接挂。
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 不用 Node 26：electron@32 的 install.js 依赖的 extract-zip@2 在 Node 26 上
          # 解压会挂起（详见 scripts/ensure-electron.cjs 的注释）。
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # ⚠️ **T87.8：打包冒烟**（每次 push / PR 都**真出一次包**）。
      #    起因：`electron-builder.yml` 里多了一行**非法键**（`win.timeStampServer`）
      #    ⇒ electron-builder 的配置校验直接失败 ⇒ **整个打包挂掉**；
      #    而「本机没重跑打包」+「CI 不打包」⇒ 两道关卡都没拦住
      #    ⇒ 直到发版工作流才炸（run 42857375893，失败在第 8 步 `Pack`）。
      #    ⇒ **谁改了打包配置，就必须有能验证打包配置的关卡。**
      # ⚠️ 直接调 `scripts/pack.cjs`（**不跑 `npm run pack`**）—— 后者会**再 build 一次**。
      # ⚠️ 产物目录用 `FNM_PACK_OUTPUT=release-ci`（与 release.yml 同一个变量名）
      #    ⇒ `release-ci/` 已在 `.gitignore` 里 ⇒ 不脏仓库。
      - name: Pack (smoke)
        run: node scripts/pack.cjs
        env:
          FNM_PACK_OUTPUT: release-ci
