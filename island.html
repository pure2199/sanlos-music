<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      灵动态词岛窗口的页面（T45）。

      CSP 与主窗口**同款**（本窗口不联网、不加载远程资源）：
      - script-src/style-src 的 'unsafe-inline'：vite dev server 会注入 react-refresh 内联脚本；
      - 页面底色必须是透明的（`island-window.css`），窗口本身也是 transparent；
      - ⚠️ media-src 与主窗口**保持同款**（含 `fnml:`）——几个页面的 CSP 必须同步，
        否则会出现「主窗口能播、词岛窗口不能播」这种极难查的不一致。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: fnm: http: https:; media-src 'self' data: blob: fnm: fnml: http: https:; font-src 'self' data:; connect-src 'self' data: blob: fnm: http: https: ws://127.0.0.1:5173 ws://localhost:5173; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"
    />
    <title>Sanlos Music · 动态词岛</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/island/main.tsx"></script>
  </body>
</html>
